# ════════════════════════════════════════════════════════════════════
# MediMesh Forum — CI Pipeline (calls reusable template)
# ════════════════════════════════════════════════════════════════════

name: "CI — medimesh-forum"

on:
  push:
    branches: [main, feature/ci-pipeline-v2]
    paths:
      - "services/medimesh-forum/**"
      - ".github/workflows/ci-medimesh-forum.yml"
      - ".github/workflows/template-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/medimesh-forum/**"
      - ".github/workflows/ci-medimesh-forum.yml"
      - ".github/workflows/template-ci.yml"

jobs:
  call-template:
    uses: ./.github/workflows/template-ci.yml
    with:
      service_name: medimesh-forum
      service_path: services/medimesh-forum
      docker_image_name: medimesh_medimesh-forum
      sonar_project_key: medimesh-forum
      node_version: "20"
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
      SONARQUBE_URL: ${{ secrets.SONARQUBE_URL }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
