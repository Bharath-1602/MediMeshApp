# ════════════════════════════════════════════════════════════════════
# MediMesh — SonarQube Project Configuration
# ════════════════════════════════════════════════════════════════════
# This file configures SonarQube to scan all 11 MediMesh microservices.
# Ensure the project key below matches your SonarQube server project.
# ════════════════════════════════════════════════════════════════════

# Project identification
sonar.projectKey=Bharath-1602_MediMeshApp
sonar.projectName=MediMesh
sonar.projectVersion=1.0.0

# ─── Source directories (all 11 microservices) ─────────────────────
sonar.sources=services/medimesh-auth, \
              services/medimesh-user, \
              services/medimesh-doctor, \
              services/medimesh-appointment, \
              services/medimesh-vitals, \
              services/medimesh-pharmacy, \
              services/medimesh-ambulance, \
              services/medimesh-complaint, \
              services/medimesh-forum, \
              medimesh-bff, \
              medimesh-frontend/src

# ─── Exclusions ────────────────────────────────────────────────────
sonar.exclusions=**/node_modules/**, \
                 **/build/**, \
                 **/dist/**, \
                 **/coverage/**, \
                 **/*.test.js, \
                 **/*.spec.js, \
                 **/k8s/**, \
                 **/helm/**, \
                 **/haproxy/**, \
                 **/.github/**

# ─── Language & Encoding ───────────────────────────────────────────
sonar.language=js
sonar.sourceEncoding=UTF-8
